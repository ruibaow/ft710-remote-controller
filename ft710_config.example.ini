; FT-710 Remote Controller 配置示例
; 复制本文件为 ft710_config.ini 并按需修改；
; 程序首次运行也会自动生成一份默认配置（缺失时）。
; 注意：COM 口、声卡设备号、摄像头设备号等为本机相关，请按实际调整。

[SERIAL]
com_port = COM8
baud_rate = 38400

[AUDIO]
sampling_rate = 48000
channels = 1
block_size = 512
device_in = -1
device_out = -1

[NETWORK]
port = 5000

[PTT]
mode = momentary

[VIDEO]
enabled = false
mode = mjpeg
device_index = 0
device_name = USB Video
width = 640
height = 480
fps = 15
quality = 2

[WEBRTC]
enabled = true
audio_codec = pcmu
video_codec = vp8

[CHANNELS]
ch_160m_1 = 1.840,LSB,
ch_160m_2 = 1.860,LSB,
ch_160m_3 = 1.900,LSB,
ch_80m_1 = 3.500,LSB,
ch_80m_2 = 3.800,LSB,
ch_80m_3 = 3.900,LSB,
ch_40m_1 = 7.050,LSB,
ch_40m_2 = 7.068,LSB,
ch_40m_3 = 7.100,LSB,
ch_20m_1 = 14.270,USB,
ch_20m_2 = 14.300,USB,
ch_20m_3 = 14.350,USB,
ch_15m_1 = 21.400,USB,
ch_15m_2 = 21.450,USB,
ch_15m_3 = 21.350,USB,
ch_10m_1 = 28.400,USB,

[LANGUAGE]
code = zh
